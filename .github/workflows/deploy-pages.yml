name: Deploy to GitHub Pages

on:
  # Deploy whenever the site changes on the default branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions required for the deploy-pages action to publish
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns on GitHub Pages for the repo via the API,
        # so no manual settings toggle is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp deploy version onto local stylesheets and scripts
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          find . -name '*.html' -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s#(href|src)=\"([^\":]+\.(css|js))\"#\1=\"\2?v=$VERSION\"#g"
          echo "Stamped assets with v=$VERSION"
          find . -name '*.html' -not -path './.git/*' -exec grep -hoE '(href|src)="[^"]*\?v=[a-f0-9]+"' {} + | sort -u

      - name: Upload site artifact
        # The site is static at the repo root (index.html + style.css).
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
