<!doctype html>
<html>
  <meta charset="utf-8" />
  <title>Breakaway</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    canvas {
      background: #eee;
      display: block;
      margin: 0 auto;
    }
  </style>

  <canvas id="myCanvas" width="480" height="320"></canvas>

  <script type="module">
    const gameColor = "#0095DD";
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    const ballRadius = 10;
    const paddleHeight = 10;
    const paddleWidth = 75;
    const brickRowCount = 5;
    const brickColumnCount = 3;
    const brickWidth = 75;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 30;
    const bricks = [];
    const gameKeys = new Set(["ArrowLeft", "ArrowRight", " ", "s", "p"]);

    let x = canvas.width / 2;
    let y = canvas.height - 30;
    let dx = 2;
    let dy = -2;
    let paddleX = (canvas.width - paddleWidth) / 2;
    let rightPressed = false;
    let leftPressed = false;
    let score = 0;
    let lives = 3;
    let pause = false;
    let gameOver = false;
    let won = false;
    let readyToPlay = false;

    function setBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
      }
    }

    function startHandler() {
      readyToPlay = true;
    }

    function keyDownHandler(e) {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (gameKeys.has(key)) {
        e.preventDefault();
      }
      if (key === "ArrowRight") {
        rightPressed = true;
      } else if (key === "s" || key === " ") {
        readyToPlay = true;
      } else if (key === "ArrowLeft") {
        leftPressed = true;
      } else if (key === "p") {
        pause = !pause;
      }
    }

    function keyUpHandler(e) {
      if (e.key === "ArrowRight") {
        rightPressed = false;
      } else if (e.key === "ArrowLeft") {
        leftPressed = false;
      }
    }

    function mouseMoveHandler(e) {
      const relativeX = e.clientX - canvas.offsetLeft;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddleX = relativeX - paddleWidth / 2;
      }
    }

    function collisionDetection() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            if (
              x > b.x &&
              x < b.x + brickWidth &&
              y > b.y &&
              y < b.y + brickHeight
            ) {
              dy = -dy;
              b.status = 0;
              score++;
              if (score === brickRowCount * brickColumnCount) {
                won = true;
                gameOver = true;
              }
            }
          }
        }
      }
    }

    function arenaBounce() {
      if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
        dx = -dx;
      }

      if (y + dy < ballRadius) {
        dy = -dy;
      } else if (y + dy > canvas.height - ballRadius) {
        if (x > paddleX && x < paddleX + paddleWidth) {
          dy = -dy;
        } else {
          lives--;
          if (!lives) {
            won = false;
            gameOver = true;
          } else {
            x = canvas.width / 2;
            y = canvas.height - 30;
            dx = 3;
            dy = -3;
            paddleX = (canvas.width - paddleWidth) / 2;
          }
        }
      }
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = gameColor;
      ctx.fill();
      ctx.closePath();
    }

    function drawPaddle() {
      ctx.beginPath();
      ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
      ctx.fillStyle = gameColor;
      ctx.fill();
      ctx.closePath();
    }

    function drawBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = r * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = c * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.beginPath();
            ctx.rect(brickX, brickY, brickWidth, brickHeight);
            ctx.fillStyle = gameColor;
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    function drawScore() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.fillText(`Score: ${score}`, 8, 20);
    }

    function drawWin() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.fillText("YOU WIN, CONGRATS!", canvas.height / 2, 20);
    }

    function drawLoss() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.fillText("GAME OVER", canvas.height / 2, 20);
    }

    function drawLives() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.fillText(`Lives: ${lives}`, canvas.width - 65, 20);
    }

    function drawPause() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.fillText("Paused", canvas.height / 2, 20);
    }

    function paddleMovement() {
      if (rightPressed && paddleX < canvas.width - paddleWidth) {
        paddleX += 7;
      } else if (leftPressed && paddleX > 0) {
        paddleX -= 7;
      }
    }

    function advanceBallPosition() {
      x += dx;
      y += dy;
    }

    function restart() {
      lives = 3;
      gameOver = false;
      won = false;
      readyToPlay = false;
      score = 0;
      setBricks();
    }

    function drawStartScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = gameColor;
      ctx.textAlign = "center";
      ctx.font = "28px Arial";
      ctx.fillText("BREAKAWAY", canvas.width / 2, canvas.height / 2 - 30);
      ctx.font = "16px Arial";
      ctx.fillText(
        "Click or press S to start",
        canvas.width / 2,
        canvas.height / 2 + 5,
      );
      ctx.font = "12px Arial";
      ctx.fillText(
        "Move: mouse or arrow keys    Pause: P",
        canvas.width / 2,
        canvas.height / 2 + 35,
      );
      ctx.textAlign = "left";
    }

    function draw() {
      if (!pause) {
        if (readyToPlay) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawBricks();
          drawBall();
          drawPaddle();
          drawScore();
          drawLives();
          collisionDetection();
          arenaBounce();
          paddleMovement();
          advanceBallPosition();

          if (gameOver) {
            if (won) {
              drawWin();
            } else {
              drawLoss();
            }
            restart();
          }
        } else {
          drawStartScreen();
        }
      } else {
        drawPause();
      }
      requestAnimationFrame(draw);
    }

    setBricks();
    document.addEventListener("keydown", keyDownHandler);
    document.addEventListener("keyup", keyUpHandler);
    document.addEventListener("mousemove", mouseMoveHandler);
    canvas.addEventListener("mousedown", startHandler);
    draw();
  </script>
</html>
