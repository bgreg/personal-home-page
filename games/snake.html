<!doctype html>
<html>
  <meta charset="utf-8" />
  <title>Snake</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    canvas {
      background: #eee;
      display: block;
      margin: 0 auto;
    }
  </style>

  <canvas id="myCanvas" width="480" height="320"></canvas>

  <script type="module">
    const gameColor = "#0095DD";
    const foodColor = "#DD3300";
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    const cellSize = 20;
    const cols = canvas.width / cellSize;
    const rows = canvas.height / cellSize;
    const food = { x: 0, y: 0 };
    const gameKeys = new Set([
      "ArrowLeft",
      "ArrowRight",
      "ArrowUp",
      "ArrowDown",
      " ",
      "s",
      "p",
    ]);

    let snake = [];
    let dx = 1;
    let dy = 0;
    let pendingDx = 1;
    let pendingDy = 0;
    let score = 0;
    let tickCount = 0;
    let tickThreshold = 8;
    let pause = false;
    let gameOver = false;
    let readyToPlay = false;

    function setSnake() {
      snake = [
        { x: 8, y: 8 },
        { x: 7, y: 8 },
        { x: 6, y: 8 },
      ];
      dx = 1;
      dy = 0;
      pendingDx = 1;
      pendingDy = 0;
    }

    function onSnake(x, y) {
      return snake.some((cell) => cell.x === x && cell.y === y);
    }

    function placeFood() {
      let fx, fy;
      do {
        fx = Math.floor(Math.random() * cols);
        fy = Math.floor(Math.random() * rows);
      } while (onSnake(fx, fy));
      food.x = fx;
      food.y = fy;
    }

    function startHandler() {
      if (gameOver) {
        restart();
      }
      readyToPlay = true;
    }

    function keyDownHandler(e) {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (gameKeys.has(key)) {
        e.preventDefault();
      }
      if (key === "ArrowLeft" && dx !== 1) {
        pendingDx = -1;
        pendingDy = 0;
      } else if (key === "ArrowRight" && dx !== -1) {
        pendingDx = 1;
        pendingDy = 0;
      } else if (key === "ArrowUp" && dy !== 1) {
        pendingDx = 0;
        pendingDy = -1;
      } else if (key === "ArrowDown" && dy !== -1) {
        pendingDx = 0;
        pendingDy = 1;
      } else if (key === "s" || key === " ") {
        startHandler();
      } else if (key === "p") {
        pause = !pause;
      }
    }

    function step() {
      dx = pendingDx;
      dy = pendingDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (
        head.x < 0 ||
        head.x >= cols ||
        head.y < 0 ||
        head.y >= rows ||
        onSnake(head.x, head.y)
      ) {
        gameOver = true;
        readyToPlay = false;
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        if (tickThreshold > 3 && score % 5 === 0) {
          tickThreshold--;
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function drawSnake() {
      ctx.fillStyle = gameColor;
      for (const cell of snake) {
        ctx.fillRect(
          cell.x * cellSize + 1,
          cell.y * cellSize + 1,
          cellSize - 2,
          cellSize - 2,
        );
      }
    }

    function drawFood() {
      ctx.fillStyle = foodColor;
      ctx.fillRect(
        food.x * cellSize + 1,
        food.y * cellSize + 1,
        cellSize - 2,
        cellSize - 2,
      );
    }

    function drawScore() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.textAlign = "left";
      ctx.fillText(`Score: ${score}`, 8, 20);
    }

    function drawPause() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.textAlign = "left";
      ctx.fillText("Paused", 8, 20);
    }

    function drawStartScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = gameColor;
      ctx.textAlign = "center";
      ctx.font = "28px Arial";
      ctx.fillText("SNAKE", canvas.width / 2, canvas.height / 2 - 30);
      ctx.font = "16px Arial";
      ctx.fillText(
        "Click or press S to start",
        canvas.width / 2,
        canvas.height / 2 + 5,
      );
      ctx.font = "12px Arial";
      ctx.fillText(
        "Move: arrow keys    Pause: P",
        canvas.width / 2,
        canvas.height / 2 + 35,
      );
      ctx.textAlign = "left";
    }

    function drawGameOver() {
      ctx.fillStyle = gameColor;
      ctx.textAlign = "center";
      ctx.font = "28px Arial";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = "16px Arial";
      ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 8);
      ctx.font = "12px Arial";
      ctx.fillText(
        "Click or press S to play again",
        canvas.width / 2,
        canvas.height / 2 + 35,
      );
      ctx.textAlign = "left";
    }

    function restart() {
      setSnake();
      placeFood();
      score = 0;
      tickCount = 0;
      tickThreshold = 8;
      gameOver = false;
      readyToPlay = false;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSnake();
      drawFood();
      drawScore();
    }

    function draw() {
      if (pause) {
        render();
        drawPause();
      } else if (readyToPlay) {
        tickCount++;
        if (tickCount >= tickThreshold) {
          tickCount = 0;
          step();
        }
        render();
      } else if (gameOver) {
        render();
        drawGameOver();
      } else {
        drawStartScreen();
      }
      requestAnimationFrame(draw);
    }

    setSnake();
    placeFood();
    document.addEventListener("keydown", keyDownHandler);
    canvas.addEventListener("mousedown", startHandler);
    draw();
  </script>
</html>
