<!DOCTYPE html>
<html>
  <meta charset="utf-8"/>
  <title>Snake</title>
  <style>
    * { padding: 0; margin: 0; }
    canvas { background: #eee; display: block; margin: 0 auto; }
  </style>

  <canvas id="myCanvas" width="480" height="320"></canvas>

  <script>
    var gameColor    = "#0095DD";
    var foodColor    = "#DD3300";
    var canvas       = document.getElementById("myCanvas");
    var ctx          = canvas.getContext("2d");
    var cellSize     = 20;
    var cols         = canvas.width / cellSize;
    var rows         = canvas.height / cellSize;
    var snake        = [];
    var dx           = 1;
    var dy           = 0;
    var pendingDx    = 1;
    var pendingDy    = 0;
    var food         = { x: 0, y: 0 };
    var score        = 0;
    var tickCount    = 0;
    var tickThreshold = 8;
    var pause        = false;
    var gameOver     = false;
    var readyToPlay  = false;

    function setSnake() {
      snake = [ { x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 } ];
      dx = 1; dy = 0;
      pendingDx = 1; pendingDy = 0;
    }

    function onSnake(x, y) {
      for(var i = 0; i < snake.length; i++) {
        if(snake[i].x == x && snake[i].y == y) {
          return true;
        }
      }
      return false;
    }

    function placeFood() {
      var fx, fy;
      do {
        fx = Math.floor(Math.random() * cols);
        fy = Math.floor(Math.random() * rows);
      } while(onSnake(fx, fy));
      food.x = fx;
      food.y = fy;
    }

    setSnake();
    placeFood();

    document.addEventListener("keydown", keyDownHandler, false);
    canvas.addEventListener("mousedown", startHandler, false);

    function startHandler() {
      if(gameOver) {
        restart();
      }
      readyToPlay = true;
    }

    function keyDownHandler(e) {
      if(e.keyCode == 37 && dx != 1) {          // Left
        pendingDx = -1; pendingDy = 0;
      }else if(e.keyCode == 39 && dx != -1) {   // Right
        pendingDx = 1; pendingDy = 0;
      }else if(e.keyCode == 38 && dy != 1) {    // Up
        pendingDx = 0; pendingDy = -1;
      }else if(e.keyCode == 40 && dy != -1) {   // Down
        pendingDx = 0; pendingDy = 1;
      }else if(e.keyCode == 83 || e.keyCode == 32) { // S or Space
        startHandler();
      }else if(e.keyCode == 80) {               // P
        pause = !pause;
      }
    }

    function step() {
      dx = pendingDx;
      dy = pendingDy;
      var head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if(head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || onSnake(head.x, head.y)) {
        gameOver = true;
        readyToPlay = false;
        return;
      }

      snake.unshift(head);

      if(head.x == food.x && head.y == food.y) {
        score++;
        if(tickThreshold > 3 && score % 5 == 0) {
          tickThreshold--;
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function drawSnake() {
      ctx.fillStyle = gameColor;
      for(var i = 0; i < snake.length; i++) {
        ctx.fillRect(snake[i].x * cellSize + 1, snake[i].y * cellSize + 1, cellSize - 2, cellSize - 2);
      }
    }

    function drawFood() {
      ctx.fillStyle = foodColor;
      ctx.fillRect(food.x * cellSize + 1, food.y * cellSize + 1, cellSize - 2, cellSize - 2);
    }

    function drawScore() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.textAlign = "left";
      ctx.fillText("Score: " + score, 8, 20);
    }

    function drawPause() {
      ctx.font = "16px Arial";
      ctx.fillStyle = gameColor;
      ctx.textAlign = "left";
      ctx.fillText("Paused", 8, 20);
    }

    function drawStartScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = gameColor;
      ctx.textAlign = "center";
      ctx.font = "28px Arial";
      ctx.fillText("SNAKE", canvas.width / 2, canvas.height / 2 - 30);
      ctx.font = "16px Arial";
      ctx.fillText("Click or press S to start", canvas.width / 2, canvas.height / 2 + 5);
      ctx.font = "12px Arial";
      ctx.fillText("Move: arrow keys    Pause: P", canvas.width / 2, canvas.height / 2 + 35);
      ctx.textAlign = "left";
    }

    function drawGameOver() {
      ctx.fillStyle = gameColor;
      ctx.textAlign = "center";
      ctx.font = "28px Arial";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = "16px Arial";
      ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 8);
      ctx.font = "12px Arial";
      ctx.fillText("Click or press S to play again", canvas.width / 2, canvas.height / 2 + 35);
      ctx.textAlign = "left";
    }

    function restart() {
      setSnake();
      placeFood();
      score = 0;
      tickCount = 0;
      tickThreshold = 8;
      gameOver = false;
      readyToPlay = false;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSnake();
      drawFood();
      drawScore();
    }

    function draw() {
      if(pause) {
        render();
        drawPause();
      } else if(readyToPlay) {
        tickCount++;
        if(tickCount >= tickThreshold) {
          tickCount = 0;
          step();
        }
        render();
      } else if(gameOver) {
        render();
        drawGameOver();
      } else {
        drawStartScreen();
      }
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</html>
